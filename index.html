<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2332">
<title>筋トレ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --accent: #3b82f6;
    --accent2: #10b981;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 70px;
    padding-top: env(safe-area-inset-top);
  }
  header {
    background: var(--card);
    padding: 14px 16px;
    border-bottom: 1px solid #2d3748;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1.15rem; font-weight: 600; }
  nav {
    display: flex;
    background: var(--card);
    border-top: 1px solid #2d3748;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1;
    padding: 10px 4px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.7rem;
    cursor: pointer;
  }
  nav button.active { color: var(--accent); }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid #2d3748;
  }
  .card h2 { font-size: 1rem; margin-bottom: 10px; }
  input, select, textarea, button.primary {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #374151;
    background: #111827;
    color: var(--text);
    margin-bottom: 8px;
    font-size: 1rem;
  }
  button.primary {
    background: var(--accent);
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .hidden { display: none; }
  .chart-container { height: 180px; margin-top: 10px; }
  .today-plan {
    background: linear-gradient(135deg, #1e3a8a, #1e40af);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .badge { background: var(--accent2); color: #000; padding: 2px 8px; border-radius: 99px; font-size: 0.7rem; font-weight: 600; }
  .yt-item iframe { width: 100%; height: 180px; border-radius: 8px; border: none; margin-top: 8px; }
  .video-suggestion { background: #111827; border-radius: 8px; padding: 10px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>筋トレ</h1>
</header>

<div class="container">
  <div id="view-today">
    <div class="today-plan">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span>今日のワークアウト</span>
        <span class="badge" id="today-date"></span>
      </div>
      <div id="today-content" style="font-size:1.05rem;font-weight:500;"></div>
      <div id="today-video" class="video-suggestion"></div>
    </div>

    <div class="card">
      <h2>体重記録</h2>
      <div style="display:flex;gap:8px;">
        <input type="number" step="0.1" id="weight-input" placeholder="体重 (kg)" style="flex:1;">
        <button class="primary" style="width:auto;padding:10px 16px;" onclick="addWeight()">記録</button>
      </div>
      <div class="chart-container">
        <canvas id="weightChart"></canvas>
      </div>
      <div id="weight-list" style="margin-top:10px;max-height:160px;overflow-y:auto;font-size:0.9rem;"></div>
    </div>
  </div>

  <div id="view-plan" class="hidden">
    <div class="card">
      <h2>週間プラン（自動スケジュール用）</h2>
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:10px;">キーワードを入れるとYouTubeが自動提案されます（例: 胸、脚、HIIT、背中、休息）</p>
      <div id="plan-editor"></div>
      <button class="primary" onclick="savePlan()">プランを保存</button>
      <button class="primary" style="background:#10b981;margin-top:8px;" onclick="autoSchedule()">今週分を自動生成</button>
    </div>
  </div>

  <div id="view-youtube" class="hidden">
    <div class="card">
      <h2>動画ライブラリ（プランに連動）</h2>
      <p style="color:var(--muted);font-size:0.85rem;margin-bottom:10px;">キーワードごとに動画を登録しておくと、その日のプランに合わせて自動で提案します。</p>
      <input type="text" id="yt-keyword" placeholder="キーワード（例: 胸, 脚, HIIT）">
      <input type="text" id="yt-url" placeholder="YouTube動画 or プレイリストURL">
      <input type="text" id="yt-title" placeholder="タイトル（任意）">
      <button class="primary" onclick="addVideo()">追加</button>
    </div>
    <div id="yt-list"></div>
  </div>

  <div id="view-settings" class="hidden">
    <div class="card">
      <h2>設定</h2>
      <button class="primary" onclick="requestNotification()">通知を許可</button>
      <button class="primary" style="background:#10b981;margin-top:8px;" onclick="exportICS()">今週のプランをカレンダー用.icsで出力</button>
      <button class="primary" style="background:#ef4444;margin-top:8px;" onclick="exportData()">データエクスポート</button>
      <button class="primary" style="background:#6b7280;margin-top:8px;" onclick="document.getElementById('import-file').click()">データインポート</button>
      <input type="file" id="import-file" accept=".json" style="display:none;" onchange="handleImport(event)">
    </div>
  </div>
</div>

<nav>
  <button class="active" onclick="showView('today')">今日</button>
  <button onclick="showView('plan')">計画</button>
  <button onclick="showView('youtube')">動画</button>
  <button onclick="showView('settings')">設定</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

const days = ['日','月','火','水','木','金','土'];
let data = JSON.parse(localStorage.getItem('workout_app_v2') || '{}');
if (!data.weights) data.weights = [];
if (!data.plan) data.plan = ['','','','','','',''];
if (!data.videos) data.videos = [];

function saveData() {
  localStorage.setItem('workout_app_v2', JSON.stringify(data));
}

function showView(name) {
  document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById('view-' + name).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (name === 'today') renderToday();
  if (name === 'plan') renderPlanEditor();
  if (name === 'youtube') renderVideos();
}

function getTodayVideo(planText) {
  if (!planText || planText.includes('休息')) return null;
  const keywords = planText.split(/[、,\s]+/);
  for (const kw of keywords) {
    const matches = data.videos.filter(v => v.keyword.toLowerCase().includes(kw.toLowerCase()) || kw.toLowerCase().includes(v.keyword.toLowerCase()));
    if (matches.length) {
      const seed = new Date().getDate() + new Date().getMonth() * 31;
      return matches[seed % matches.length];
    }
  }
  return data.videos[0] || null;
}

function renderToday() {
  const now = new Date();
  document.getElementById('today-date').textContent = `${now.getMonth()+1}/${now.getDate()} (${days[now.getDay()]})`;
  const plan = data.plan[now.getDay()] || '休息日';
  document.getElementById('today-content').textContent = plan || '休息日';

  const video = getTodayVideo(plan);
  const videoEl = document.getElementById('today-video');
  if (video) {
    const embed = video.isPlaylist
      ? `https://www.youtube.com/embed/videoseries?list=${video.id}`
      : `https://www.youtube.com/embed/${video.id}`;
    videoEl.innerHTML = `<div style="font-size:0.85rem;color:var(--muted);margin-bottom:4px;">おすすめ動画</div>
      <strong>${video.title}</strong>
      <iframe src="${embed}" allowfullscreen></iframe>`;
  } else {
    videoEl.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;">このプランに合う動画がまだ登録されていません</div>';
  }

  renderWeights();
  maybeNotify(plan);
}

function maybeNotify(plan) {
  if (Notification.permission === 'granted' && plan && !plan.includes('休息')) {
    new Notification('今日のワークアウト', { body: plan });
  }
}

function addWeight() {
  const val = parseFloat(document.getElementById('weight-input').value);
  if (!val || val <= 0) return;
  data.weights.push({ date: new Date().toISOString().slice(0,10), weight: val });
  data.weights.sort((a,b) => a.date.localeCompare(b.date));
  saveData();
  document.getElementById('weight-input').value = '';
  renderWeights();
}

function renderWeights() {
  const list = document.getElementById('weight-list');
  list.innerHTML = data.weights.slice().reverse().map(w =>
    `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2d3748;"><span>${w.date}</span><span>${w.weight} kg</span></div>`
  ).join('') || '<div style="color:var(--muted);">まだ記録がありません</div>';

  const ctx = document.getElementById('weightChart').getContext('2d');
  if (window.weightChart) window.weightChart.destroy();
  window.weightChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.weights.map(w => w.date.slice(5)),
      datasets: [{
        label: '体重',
        data: data.weights.map(w => w.weight),
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.1)',
        tension: 0.3,
        fill: true,
        pointRadius: 3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: false } }
    }
  });
}

function renderPlanEditor() {
  const container = document.getElementById('plan-editor');
  container.innerHTML = days.map((d, i) => `
    <div style="margin-bottom:10px;">
      <label style="display:block;margin-bottom:4px;color:var(--muted);font-size:0.9rem;">${d}曜日</label>
      <textarea data-day="${i}" rows="2" style="width:100%;">${data.plan[i] || ''}</textarea>
    </div>
  `).join('');
}

function savePlan() {
  document.querySelectorAll('#plan-editor textarea').forEach(ta => {
    data.plan[parseInt(ta.dataset.day)] = ta.value.trim();
  });
  saveData();
  alert('プランを保存しました');
  showView('today');
}

function autoSchedule() {
  const template = [
    '休息',
    '胸・三頭',
    '背中・二頭',
    '休息',
    '脚・肩',
    'HIIT or 有酸素',
    '休息'
  ];
  if (confirm('現在のプランを上書きして、基本的な週3分割を自動設定しますか？')) {
    data.plan = template;
    saveData();
    renderPlanEditor();
    alert('自動設定しました。必要に応じて編集してください。');
  }
}

function extractId(url) {
  let m = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
  if (m) return { id: m[1], isPlaylist: true };
  m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  if (m) return { id: m[1], isPlaylist: false };
  return null;
}

function addVideo() {
  const keyword = document.getElementById('yt-keyword').value.trim();
  const url = document.getElementById('yt-url').value.trim();
  const title = document.getElementById('yt-title').value.trim() || keyword;
  if (!keyword || !url) return alert('キーワードとURLを入力してください');
  const parsed = extractId(url);
  if (!parsed) return alert('正しいYouTube URLを入力してください');
  data.videos.push({ keyword, title, url, ...parsed });
  saveData();
  document.getElementById('yt-keyword').value = '';
  document.getElementById('yt-url').value = '';
  document.getElementById('yt-title').value = '';
  renderVideos();
}

function renderVideos() {
  const container = document.getElementById('yt-list');
  const grouped = {};
  data.videos.forEach(v => {
    if (!grouped[v.keyword]) grouped[v.keyword] = [];
    grouped[v.keyword].push(v);
  });
  container.innerHTML = Object.keys(grouped).map(kw => `
    <div class="card">
      <h2 style="font-size:0.95rem;">${kw}</h2>
      ${grouped[kw].map((v, i) => `
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid #2d3748;">
          <div style="display:flex;justify-content:space-between;">
            <span>${v.title}</span>
            <button onclick="deleteVideo('${kw}', ${i})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:0.8rem;">削除</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('') || '<div class="card" style="color:var(--muted);">動画を登録してください</div>';
}

function deleteVideo(keyword, idx) {
  const matches = data.videos.filter(v => v.keyword === keyword);
  const target = matches[idx];
  data.videos = data.videos.filter(v => v !== target);
  saveData();
  renderVideos();
}

function requestNotification() {
  Notification.requestPermission().then(p => {
    alert(p === 'granted' ? '通知を許可しました' : '通知が許可されませんでした');
  });
}

function exportICS() {
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay());
  let ics = 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Personal Workout//JP\n';
  data.plan.forEach((plan, i) => {
    if (!plan || plan.includes('休息')) return;
    const date = new Date(startOfWeek);
    date.setDate(startOfWeek.getDate() + i);
    const dateStr = date.toISOString().slice(0,10).replace(/-/g,'');
    ics += `BEGIN:VEVENT\nDTSTART:${dateStr}T190000\nDTEND:${dateStr}T200000\nSUMMARY:筋トレ: ${plan}\nDESCRIPTION:アプリから\nEND:VEVENT\n`;
  });
  ics += 'END:VCALENDAR';
  const blob = new Blob([ics], { type: 'text/calendar' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'workout-plan.ics';
  a.click();
  alert('.icsファイルをダウンロードしました。カレンダーアプリでインポートしてください。');
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'workout-data.json';
  a.click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      data = JSON.parse(reader.result);
      saveData();
      alert('インポートしました');
      location.reload();
    } catch {
      alert('ファイルが正しくありません');
    }
  };
  reader.readAsText(file);
}

renderToday();
</script>
</body>
</html>
